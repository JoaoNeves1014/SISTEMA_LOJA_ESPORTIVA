<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tela de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Cadastrar Produto</h2>
        
        <label>Produto:</label>
        <input type="text" placeholder="Nome do produto">

        <label>Categoria:</label>
        <select>
            <option>camisa</option>
            <option>bermuda</option>
            <option>calçado</option>
        </select>

        <label>Valor (R$):</label>
        <input type="text" placeholder="0,00">

        <button>Cadastrar</button>

        <h3>Produtos Cadastrados:</h3>
        <table>
            <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Valor (R$)</th>
            </tr>
            <tr>
                <td>Camisa de Time</td>
                <td>camisa</td>
                <td>150,00</td>
            </tr>
            <tr>
                <td>Bermuda Térmica</td>
                <td>bermuda</td>
                <td>80,00</td>
            </tr>
            <tr>
                <td>Tênis de Corrida</td>
                <td>calçado</td>
                <td>300,00</td>
            </tr>
        </table>
        
        <br>
    </div>

</body>
</html>
